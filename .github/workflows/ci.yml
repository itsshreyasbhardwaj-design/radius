name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # radius diffs against history; tests create local repos

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -q

      - name: Dogfood (radius selects its own tests)
        run: |
          git config user.email ci@example.com
          git config user.name ci
          radius map
          radius status
          radius affected --json
